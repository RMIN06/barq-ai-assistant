name: Barq CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  GROQ_API_KEY: "ci-placeholder-key"
  DEEPGRAM_API_KEY: "ci-placeholder-key"

jobs:
  # Python backend tests
  test-backend:
    name: Test Backend (Python)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Run backend tests
        run: |
          python -m pytest tests/ -q -p no:cacheprovider

      - name: Run type checking (mypy)
        continue-on-error: true
        run: |
          python -m pip install mypy
          python -m mypy --ignore-missing-imports server.py brain.py listener.py speaker.py wakeword_v2.py config.py screen_context.py vision.py barqlog.py auth.py health.py barq_service.py display_manager.py memory_v2.py

      - name: Run security scan (bandit)
        continue-on-error: true
        run: |
          python -m pip install bandit
          python -m bandit -r . -x tests/ -q

  # Frontend tests
  test-frontend:
    name: Test Frontend (Next.js)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: barq_ui/package-lock.json

      - name: Install dependencies
        run: |
          cd barq_ui
          npm ci

      - name: Run linting
        run: |
          cd barq_ui
          npm run lint

      - name: Type check
        run: |
          cd barq_ui
          npx tsc --noEmit

      - name: Build
        run: |
          cd barq_ui
          npm run build

  # Electron desktop tests
  test-desktop:
    name: Test Desktop (Electron)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: |
          cd desktop
          npm ci

      - name: Build desktop app
        run: |
          cd desktop
          npm run dist -- --publish=never

  # Integration test
  integration-test:
    name: Integration Test
    runs-on: windows-latest
    needs: [test-backend, test-frontend]
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            barq_ui/package-lock.json
            desktop/package-lock.json

      - name: Install all dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt
          cd barq_ui
          npm ci
          cd ../desktop
          npm ci

      - name: Start backend
        run: |
          Start-Process python -ArgumentList "-m", "uvicorn", "server:app", "--host", "127.0.0.1", "--port", "8000" -WindowStyle Hidden
          Start-Sleep 5

      - name: Test health endpoints
        run: |
          $response = Invoke-RestMethod -Uri "http://127.0.0.1:8000/health/live"
          Write-Host "Live: $($response.status)"
          # Readiness depends on provider keys and audio devices unavailable in CI.

      - name: Test WebSocket auth
        run: |
          # Test would require auth token - skip in CI without full setup
          Write-Host "WebSocket auth test skipped in CI"

      - name: Cleanup
        run: |
          Write-Host "Runner cleanup handles the backend process."

  # Release
  release:
    name: Create Release
    runs-on: windows-latest
    needs: [test-backend, test-frontend, test-desktop]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd desktop
          npm ci

      - name: Build release
        run: |
          cd desktop
          npm run dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
